<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ComProg Final Preparation — คลังข้อสอบวิชาเขียนโปรแกรม (61 ข้อ)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Design Tokens: Warm Paper & Ink ─── */
    :root {
      /* Palette — warm paper ramp */
      --bg:             #f5f1ea;
      --surface:        #fdfbf7;
      --surface-subtle: #e8e3da;
      --surface-hover:  #dedad0;
      --border:         rgba(31,27,22,0.13);
      --border-focus:   rgba(31,27,22,0.32);

      --text-main:   #18140f;
      --text-muted:  #3d3630;
      --text-subtle: #5e554a;

      --accent:        #1a56db;
      --accent-soft:   #eff3ff;
      --accent-border: #c3d2f5;

      --green:        #166534;
      --green-bg:     #f0fdf4;
      --green-border: #86efac;
      --green-text:   #14532d;

      --red:        #991b1b;
      --red-bg:     #fef2f2;
      --red-border: #fca5a5;
      --red-text:   #7f1d1d;

      /* Code surfaces stay dark navy for contrast */
      --code-bg:   #0f1117;
      --code-text: #e4e8f0;

      --font-body: 'IBM Plex Sans Thai', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-code: 'IBM Plex Mono', monospace;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 10px;

      --ease: cubic-bezier(0.22,1,0.36,1);

      --container-max: 760px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 96px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* ─── Sticky Header ─── */
    .site-header {
      background: rgba(253,251,247,0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-inner {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-title {
      font-size: 0.93rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-course {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      font-weight: 500;
    }
    .header-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .progress-bar-container {
      width: 88px;
      height: 5px;
      background: var(--surface-subtle);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--text-main);
      width: 0%;
      transition: width 300ms var(--ease);
    }

    /* ─── Category Tabs ─── */
    .tab-section {
      max-width: var(--container-max);
      margin: 20px auto 0;
      padding: 0 16px;
    }
    .tab-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tab-list::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 7px 13px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: color 150ms, background-color 150ms, border-color 150ms;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      flex-shrink: 0;
    }
    .tab-btn:hover {
      border-color: var(--border-focus);
      color: var(--text-main);
      background: var(--surface-hover);
    }
    .tab-btn.active {
      background: var(--text-main);
      color: #fff;
      border-color: var(--text-main);
    }
    .tab-count {
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--surface-subtle);
      color: var(--text-muted);
      font-weight: 600;
      font-family: var(--font-code);
    }
    .tab-btn.active .tab-count {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }

    /* ─── Summary Banner ─── */
    .summary-card {
      max-width: var(--container-max);
      margin: 12px auto 0;
      padding: 0 16px;
    }
    .summary-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .summary-info h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 2px;
    }
    .summary-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .score-counts {
      display: flex;
      gap: 14px;
      font-size: 0.82rem;
    }
    .score-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .dot-correct { background: var(--green); }
    .dot-wrong   { background: var(--red);   }
    .dot-pending { background: var(--text-subtle); }

    /* ─── Quiz Card Flow ─── */
    .quiz-flow {
      max-width: var(--container-max);
      margin: 16px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ─── Question Card ─── */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      transition: border-color 200ms, border-left-color 200ms, background-color 200ms;
    }
    /* Correct / wrong: left-margin annotation stripe */
    .question-card.status-correct {
      border-left-color: var(--green);
      background: #fbfef9;
    }
    .question-card.status-wrong {
      border-left-color: var(--red);
      background: #fffcfc;
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .q-tag-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .q-num-tag {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-subtle);
      font-family: var(--font-code);
    }
    .q-cat-tag {
      font-size: 0.7rem;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .q-status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
      display: none;
    }
    .q-status-badge.correct {
      display: inline-block;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
    }
    .q-status-badge.wrong {
      display: inline-block;
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red-border);
    }

    /* ─── Question Text ─── */
    .q-content {
      margin-bottom: 14px;
    }
    .q-premise {
      font-size: 0.93rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    /* คำถามหลัก — กล่องไฮไลท์เบาๆ เพื่อแยกชัดจาก premise */
    .q-ask {
      font-size: 1.01rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.65;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(31,27,22,0.12);
      border-left: 3px solid var(--text-main);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 10px 13px;
      margin-top: 2px;
    }
    /* คำถามที่อยู่หลัง code block */
    .q-ask-after-code {
      margin-top: 0;
      border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    }
    /* keyword ในโจทย์ — highlighter สีเหลืองอ่อน */
    .q-ask strong {
      background: #fef08a;
      color: #422006;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
    }

    /* ─── Inline Code ─── */
    code {
      font-family: var(--font-code);
      font-size: 0.86em;
      background: #e8e3da;
      border: 1px solid rgba(31,27,22,0.22);
      padding: 1px 5px;
      border-radius: 3px;
      color: #18140f;
    }

    /* ─── Code Block ─── */
    .code-block {
      background: var(--code-bg);
      color: var(--code-text);
      font-family: var(--font-code);
      font-size: 0.83rem;
      line-height: 1.55;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin: 12px 0 16px;
      border: 1px solid #1c2130;
      -webkit-overflow-scrolling: touch;
    }

    /* ─── Choices ─── */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    .choice-btn {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-family: var(--font-body);
      font-size: 0.91rem;
      color: var(--text-main);
      cursor: pointer;
      transition: color 150ms, background-color 150ms, border-color 150ms;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      line-height: 1.55;
      min-height: 48px;
    }
    .choice-btn:hover:not(.locked) {
      border-color: var(--border-focus);
      background: var(--surface-hover);
    }
    .choice-btn:active:not(.locked) {
      transform: scale(0.995);
    }
    .choice-btn.locked {
      cursor: default;
    }

    .choice-key {
      font-family: var(--font-code);
      font-weight: 500;
      font-size: 0.82rem;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      margin-top: 2px;
    }
    .choice-text {
      flex: 1;
      padding-top: 1px;
    }
    .choice-text code {
      background: var(--surface-subtle);
      border-color: var(--border-focus);
      color: var(--text-main);
      font-weight: 500;
      font-size: 0.86em;
    }

    /* ─── Choice States ─── */
    .choice-btn.is-correct {
      background: var(--green-bg) !important;
      border-color: var(--green-border) !important;
      color: var(--green-text) !important;
      font-weight: 500;
    }
    .choice-btn.is-correct .choice-key {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    .choice-btn.is-wrong {
      background: var(--red-bg) !important;
      border-color: var(--red-border) !important;
      color: var(--red-text) !important;
    }
    .choice-btn.is-wrong .choice-key {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .choice-btn.is-dimmed {
      opacity: 0.38;
    }

    /* ─── Explanation Box ─── */
    .explanation-box {
      margin-top: 14px;
      padding: 14px 16px;
      background: var(--surface-subtle);
      border-left: 2px solid var(--border-focus);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.87rem;
      line-height: 1.65;
      color: var(--text-muted);
      display: none;
    }
    .explanation-box.show {
      display: block;
      animation: fadeSlide 0.2s var(--ease) forwards;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-3px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    .explanation-box h4 {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .explanation-box p { margin-bottom: 6px; }
    .explanation-box p:last-child { margin-bottom: 0; }
    .explanation-box ul,
    .explanation-box ol {
      margin-left: 18px;
      margin-top: 4px;
      margin-bottom: 4px;
    }
    .explanation-box li { margin-bottom: 4px; }

    /* ─── Bottom Footer ─── */
    .quiz-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(253,251,247,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 30;
    }
    .btn-action {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-family: var(--font-body);
      transition: color 150ms, background-color 150ms, border-color 150ms;
      touch-action: manipulation;
    }
    .btn-action:hover {
      background: var(--surface-hover);
      border-color: var(--border-focus);
    }
    .btn-action.btn-primary {
      background: var(--text-main);
      color: #fff;
      border-color: var(--text-main);
    }
    .btn-action.btn-primary:hover {
      background: #3a3028;
    }

    /* ─── Modal ─── */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,10,5,0.52);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      max-width: 460px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 12px 32px -6px rgba(0,0,0,0.14);
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .modal-score {
      font-size: 2.8rem;
      font-weight: 700;
      font-family: var(--font-code);
      color: var(--text-main);
      margin: 10px 0 4px;
      letter-spacing: -0.02em;
    }
    .modal-sub {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .cat-breakdown {
      display: flex;
      flex-direction: column;
      gap: 7px;
      background: var(--surface-subtle);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      text-align: left;
      font-size: 0.82rem;
    }
    .cat-breakdown-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
    }
    .cat-breakdown-row strong {
      color: var(--text-main);
      font-family: var(--font-code);
    }
    .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* ─── Mobile ─── */
    @media (max-width: 640px) {
      body {
        font-size: 14.5px;
        padding-bottom: 84px;
      }
      .header-inner {
        padding: 10px 14px;
      }
      .brand-title {
        font-size: 0.86rem;
      }
      .header-stats {
        font-size: 0.76rem;
        gap: 8px;
      }
      .progress-bar-container {
        width: 68px;
      }
      .tab-section {
        padding: 0 12px;
        margin-top: 12px;
      }
      .tab-btn {
        padding: 6px 10px;
        font-size: 0.78rem;
      }
      .summary-card {
        padding: 0 12px;
        margin-top: 10px;
      }
      .summary-box {
        padding: 12px 14px;
      }
      .summary-info h1 {
        font-size: 0.93rem;
      }
      .score-counts {
        font-size: 0.78rem;
        gap: 10px;
      }
      .quiz-flow {
        padding: 0 12px;
        margin-top: 14px;
        gap: 12px;
      }
      .question-card {
        padding: 16px 14px;
        border-radius: var(--radius-md);
      }
      .q-premise {
        font-size: 0.88rem;
        margin-bottom: 4px;
      }
      .q-ask {
        font-size: 0.95rem;
      }
      .code-block {
        padding: 10px 12px;
        font-size: 0.78rem;
        margin: 10px 0 14px;
      }
      .choice-btn {
        padding: 10px 12px;
        font-size: 0.87rem;
        gap: 10px;
      }
      .choice-key {
        width: 22px;
        height: 22px;
        font-size: 0.78rem;
      }
      .explanation-box {
        padding: 12px 13px;
        font-size: 0.83rem;
      }
      .quiz-footer {
        padding: 10px 12px;
        gap: 8px;
      }
      .btn-action {
        padding: 9px 12px;
        font-size: 0.82rem;
        flex: 1;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-title">
        <span>ComProg Final</span>
        <span class="badge-course">61 ข้อ</span>
      </div>
      <div class="header-stats">
        <span>ทำแล้ว <strong id="stat-answered">0</strong>/<span id="stat-total">61</span></span>
        <div class="progress-bar-container" title="ความคืบหน้า">
          <div class="progress-bar-fill" id="stat-progress-bar"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Category Filter Tabs -->
  <nav class="tab-section" aria-label="หมวดหมู่ข้อสอบ">
    <div class="tab-list">
      <button class="tab-btn active" type="button" onclick="filterCategory('all', this)">
        ทั้งหมด <span class="tab-count" id="badge-count-all">61</span>
      </button>
      <button class="tab-btn" type="button" onclick="filterCategory('tuple_dict', this)">
        Tuple &amp; Dict <span class="tab-count" id="badge-count-tuple_dict">24</span>
      </button>
      <button class="tab-btn" type="button" onclick="filterCategory('oop', this)">
        OOP <span class="tab-count" id="badge-count-oop">6</span>
      </button>
      <button class="tab-btn" type="button" onclick="filterCategory('pygame', this)">
        Pygame <span class="tab-count" id="badge-count-pygame">16</span>
      </button>
      <button class="tab-btn" type="button" onclick="filterCategory('ai', this)">
        Artificial Intelligence <span class="tab-count" id="badge-count-ai">15</span>
      </button>
    </div>
  </nav>

  <!-- Summary Info Banner -->
  <section class="summary-card">
    <div class="summary-box">
      <div class="summary-info">
        <h1 id="summary-category-title">คลังข้อสอบรวมทั้งหมด (61 ข้อ)</h1>
        <p>แตะเลือกคำตอบเพื่อตรวจทันที พร้อมคำอธิบายเฉลยอย่างละเอียด</p>
      </div>
      <div class="score-counts">
        <div class="score-item">
          <span class="dot dot-correct"></span>
          <span>ถูก: <strong id="count-correct">0</strong></span>
        </div>
        <div class="score-item">
          <span class="dot dot-wrong"></span>
          <span>ผิด: <strong id="count-wrong">0</strong></span>
        </div>
        <div class="score-item">
          <span class="dot dot-pending"></span>
          <span>เหลือ: <strong id="count-remaining">61</strong></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Questions Container -->
  <main class="quiz-flow" id="quiz-flow-container">
    <!-- Rendered dynamically by script -->
  </main>

  <!-- Bottom Fixed Footer -->
  <footer class="quiz-footer">
    <button class="btn-action" type="button" onclick="resetQuiz()">ทำใหม่ทั้งหมด</button>
    <button class="btn-action btn-primary" type="button" onclick="openResultsModal()">ดูสรุปคะแนนรวม</button>
  </footer>

    // State Tracking
    const quizState = {
      activeCategory: 'all',
      answers: {},
      correctCount: 0,
      wrongCount: 0
    };

    // Render Question Cards into Flow
    function renderQuestions() {
      const container = document.getElementById('quiz-flow-container');
      container.innerHTML = '';

      const filtered = quizState.activeCategory === 'all'
        ? QUIZ_DATA
        : QUIZ_DATA.filter(q => q.cat === quizState.activeCategory);

      filtered.forEach((q) => {
        const card = document.createElement('article');
        card.className = 'question-card';
        card.id = `card-${q.id}`;

        const isAnswered = !!quizState.answers[q.id];
        const answerInfo = quizState.answers[q.id];

        if (isAnswered) {
          card.classList.add(answerInfo.isCorrect ? 'status-correct' : 'status-wrong');
        }

        // Top Meta Tags
        const metaDiv = document.createElement('div');
        metaDiv.className = 'q-meta';
        metaDiv.innerHTML = `
          <div class="q-tag-group">
            <span class="q-num-tag">ข้อที่ ${q.id}</span>
            <span class="q-cat-tag">${q.catLabel}</span>
          </div>
          <span class="q-status-badge ${isAnswered ? (answerInfo.isCorrect ? 'correct' : 'wrong') : ''}" id="badge-${q.id}">
            ${isAnswered ? (answerInfo.isCorrect ? '✓ ตอบถูกต้อง' : `✗ ตอบผิด (เฉลยข้อ ${q.answer})`) : ''}
          </span>
        `;
        card.appendChild(metaDiv);

        // Structured Question Title (Premise + Code + Question)
        const qContent = document.createElement('div');
        qContent.className = 'q-content';
        let questionHtml = '';
        if (q.premise) {
          questionHtml += `<div class="q-premise">${q.premise}</div>`;
        }
        // ask (before code) OR ask2 (after code)
        if (q.ask) {
          questionHtml += `<div class="q-ask">${q.ask}</div>`;
        }
        qContent.innerHTML = questionHtml;
        card.appendChild(qContent);

        // Optional Code Snippet
        if (q.code) {
          const pre = document.createElement('pre');
          pre.className = 'code-block';
          pre.textContent = q.code;
          card.appendChild(pre);
        }

        // ask2: question that appears AFTER the code block
        if (q.ask2) {
          const askDiv = document.createElement('div');
          askDiv.className = 'q-ask q-ask-after-code';
          askDiv.innerHTML = q.ask2;
          card.appendChild(askDiv);
        }

        // Choices List
        const choicesDiv = document.createElement('div');
        choicesDiv.className = 'choices-list';

        q.choices.forEach(c => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'choice-btn';

          if (isAnswered) {
            btn.classList.add('locked');
            if (c.key === q.answer) {
              btn.classList.add('is-correct');
            } else if (c.key === answerInfo.choice && !answerInfo.isCorrect) {
              btn.classList.add('is-wrong');
            } else {
              btn.classList.add('is-dimmed');
            }
          }

          // Auto-wrap plain code snippets in <code> tags if text looks like code
          let displayText = c.text;
          if (!displayText.includes('<')) {
            const isMultiLine = displayText.includes('\n');
            const isCode = isMultiLine ||
              /^\s*(x|y|d|m|D|D1|D2|regist|info|fruits|dancers|sports|gentlemen|total|new_fruits|dd)\s*[=\[]/.test(displayText) ||
              /^\s*(del|print|for|if)\b/.test(displayText) ||
              /^\s*\{[^:}]+:/.test(displayText) ||
              /^\s*gentlemen\s*=/.test(displayText) ||
              /^\{'[A-Za-z]/.test(displayText);
            if (isCode) {
              const escaped = displayText
                .replace(/&/g,'&amp;')
                .replace(/</g,'&lt;')
                .replace(/>/g,'&gt;');
              if (isMultiLine) {
                displayText = `<code class="choice-code-block">${escaped}</code>`;
              } else {
                displayText = `<code class="choice-code-inline">${escaped}</code>`;
              }
            }
          }

          btn.innerHTML = `
            <span class="choice-key">${c.key}</span>
            <span class="choice-text">${displayText}</span>
          `;

          btn.onclick = () => handleChoiceClick(q.id, c.key, q.answer);
          choicesDiv.appendChild(btn);
        });
        card.appendChild(choicesDiv);

        // Explanation Box
        const expDiv = document.createElement('div');
        expDiv.className = `explanation-box ${isAnswered ? 'show' : ''}`;
        expDiv.id = `exp-${q.id}`;
        expDiv.innerHTML = `
          <h4>เฉลยละเอียดและหลักคิด:</h4>
          ${q.explanation}
        `;
        card.appendChild(expDiv);

        container.appendChild(card);
      });

      updateStatsUI();
    }

    // Handle User Click Option
    function handleChoiceClick(questionId, chosenKey, correctKey) {
      if (quizState.answers[questionId]) return;

      const isCorrect = (chosenKey === correctKey);
      quizState.answers[questionId] = { choice: chosenKey, isCorrect: isCorrect };

      if (isCorrect) {
        quizState.correctCount++;
      } else {
        quizState.wrongCount++;
      }

      const card = document.getElementById(`card-${questionId}`);
      if (card) {
        const badge = document.getElementById(`badge-${questionId}`);
        const exp = document.getElementById(`exp-${questionId}`);

        if (isCorrect) {
          card.classList.add('status-correct');
          badge.className = 'q-status-badge correct';
          badge.textContent = '✓ ตอบถูกต้อง';
        } else {
          card.classList.add('status-wrong');
          badge.className = 'q-status-badge wrong';
          badge.textContent = `✗ ตอบผิด (เฉลยข้อ ${correctKey})`;
        }

        const buttons = card.querySelectorAll('.choice-btn');
        buttons.forEach(btn => {
          btn.classList.add('locked');
          const keySpan = btn.querySelector('.choice-key');
          const letter = keySpan ? keySpan.textContent.trim() : '';

          if (letter === correctKey) {
            btn.classList.add('is-correct');
          } else if (letter === chosenKey && !isCorrect) {
            btn.classList.add('is-wrong');
          } else {
            btn.classList.add('is-dimmed');
          }
        });

        exp.classList.add('show');
      }

      updateStatsUI();
    }

    // Switch Category Tab
    function filterCategory(categoryKey, targetBtn) {
      quizState.activeCategory = categoryKey;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (targetBtn) {
        targetBtn.classList.add('active');
      }

      const totalAll = QUIZ_DATA.length;
      const countTD = QUIZ_DATA.filter(q => q.cat === 'tuple_dict').length;
      const countOOP = QUIZ_DATA.filter(q => q.cat === 'oop').length;
      const countPG = QUIZ_DATA.filter(q => q.cat === 'pygame').length;
      const countAI = QUIZ_DATA.filter(q => q.cat === 'ai').length;

      const titles = {
        'all': `คลังข้อสอบรวมทั้งหมด (${totalAll} ข้อ)`,
        'tuple_dict': `หมวดที่ 1: Tuple & Dictionary (${countTD} ข้อ)`,
        'oop': `หมวดที่ 2: Object-Oriented Programming (${countOOP} ข้อ)`,
        'pygame': `หมวดที่ 3: Pygame (${countPG} ข้อ)`,
        'ai': `หมวดที่ 4: ปัญญาประดิษฐ์และจริยธรรม AI (${countAI} ข้อ)`
      };
      document.getElementById('summary-category-title').textContent = titles[categoryKey] || 'คลังข้อสอบ';

      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Update Tab Badges Dynamically
    function updateBadgeCounts() {
      const counts = { all: QUIZ_DATA.length };
      QUIZ_DATA.forEach(q => {
        counts[q.cat] = (counts[q.cat] || 0) + 1;
      });
      for (const [key, val] of Object.entries(counts)) {
        const el = document.getElementById('badge-count-' + key);
        if (el) el.textContent = val;
      }
    }

    // Update Counter Stats
    function updateStatsUI() {
      const totalOverall = QUIZ_DATA.length;
      const answeredTotal = Object.keys(quizState.answers).length;
      const progressPercent = Math.round((answeredTotal / totalOverall) * 100);

      document.getElementById('stat-answered').textContent = answeredTotal;
      document.getElementById('stat-total').textContent = totalOverall;
      document.getElementById('stat-progress-bar').style.width = `${progressPercent}%`;

      document.getElementById('count-correct').textContent = quizState.correctCount;
      document.getElementById('count-wrong').textContent = quizState.wrongCount;
      document.getElementById('count-remaining').textContent = totalOverall - answeredTotal;

      updateBadgeCounts();
    }

    // Results Modal
    function openResultsModal() {
      const total = QUIZ_DATA.length;
      const answered = Object.keys(quizState.answers).length;
      const percent = Math.round((quizState.correctCount / total) * 100);

      document.getElementById('modal-score-display').textContent = `${quizState.correctCount} / ${total}`;
      
      let subText = `ตอบถูก ${quizState.correctCount} ข้อ คิดเป็น ${percent}%`;
      if (answered < total) {
        subText += ` (ยังทำไม่ครบ เหลืออีก ${total - answered} ข้อ)`;
      }
      document.getElementById('modal-sub-display').textContent = subText;

      const cats = [
        { key: 'tuple_dict', label: 'Tuple & Dictionary' },
        { key: 'oop', label: 'Object-Oriented Programming (OOP)' },
        { key: 'pygame', label: 'Pygame' },
        { key: 'ai', label: 'Artificial Intelligence (AI)' }
      ];

      const breakdownContainer = document.getElementById('modal-cat-breakdown');
      breakdownContainer.innerHTML = '';

      cats.forEach(c => {
        const catQuestions = QUIZ_DATA.filter(q => q.cat === c.key);
        let correctInCat = 0;
        let answeredInCat = 0;

        catQuestions.forEach(q => {
          if (quizState.answers[q.id]) {
            answeredInCat++;
            if (quizState.answers[q.id].isCorrect) correctInCat++;
          }
        });

        const row = document.createElement('div');
        row.className = 'cat-breakdown-row';
        row.innerHTML = `
          <span>${c.label} (${catQuestions.length} ข้อ):</span>
          <strong>${correctInCat} / ${catQuestions.length} (ทำแล้ว ${answeredInCat})</strong>
        `;
        breakdownContainer.appendChild(row);
      });

      document.getElementById('modal-summary').classList.add('open');
    }

    function closeResultsModal() {
      document.getElementById('modal-summary').classList.remove('open');
    }

    function resetQuiz() {
      if (confirm('คุณต้องการรีเซ็ตคำตอบเพื่อเริ่มทำใหม่ทั้งหมดใช่หรือไม่?')) {
        quizState.answers = {};
        quizState.correctCount = 0;
        quizState.wrongCount = 0;
        renderQuestions();
      }
    }

    document.getElementById('modal-summary').addEventListener('click', function(e) {
      if (e.target === this) closeResultsModal();
    });

    // Initialize
    renderQuestions();
  </script>
</body>
</html>
